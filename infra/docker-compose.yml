services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: rethox
      POSTGRES_USER: rethox
      POSTGRES_PASSWORD: rethox
    ports: ["5432:5432"]
    volumes: ["rethox_pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rethox"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  rethox_pg:
