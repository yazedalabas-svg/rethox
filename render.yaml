services:
  - type: web
    name: rethox
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    plan: starter
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: TTS_CACHE_DIR
        value: /var/data/tts-cache
      - key: JWT_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: openai/gpt-4o-mini
      # All checkouts are deliberately simulated until live billing is enabled
      # again.  Demo orders grant the book but never contact Moyasar or charge
      # a card.
      - key: PAYMENTS_MODE
        value: demo
      - key: PUBLIC_SITE_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Moyasar. Set the secret key and the webhook secret in the Render
      # dashboard; they must never be committed. Leaving PAYMENTS_MODE unset
      # keeps real charges on — checkout fails closed if the key is missing.
      - key: MOYASR_SECRET_KEY
        sync: false
      - key: MOYASR_WEBHOOK_SECRET
        sync: false
    disk:
      name: rethox-data
      mountPath: /var/data
      sizeGB: 1
